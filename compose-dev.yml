services:
  web:
    build:
      context: ./otiva_sshop
      dockerfile: Dockerfile-dev
    image: django-app-dev:1.0.0
    container_name: django-app
    command: python -m uvicorn app.asgi:application --host 0.0.0.0
    restart: unless-stopped
    expose:
      - 8000
    volumes:
      - ./otiva_sshop/logs:/usr/src/otiva_sshop/logs
    env_file:
      - ./otiva_sshop/.env
    environment:
      DOCKER_START_APP: true
    depends_on:
      - db
      - redis
    networks:
      - default_net


  nginx:
    image: nginx:alpine-slim
    container_name: nginx
    volumes:
        - ./conf.d:/etc/nginx/conf.d
        - static_volume:/app/static
    ports:
      - "8000:80"
    depends_on:
      - web
    networks:
      - default_net


  db:
    image: postgres:17-alpine
    container_name: db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=otiva_shop-mamk
      - POSTGRES_PASSWORD=otiva_shop-mamk
      - POSTGRES_DB=otiva_shop-db
    volumes:
      - pg_data:/var/lib/postgresql/data/
    networks:
      - default_net


  celery:
    image: django-app-dev:1.0.0
    container_name: celery
    entrypoint: []
    command: celery -A app.misc.celery_misc worker -n main --loglevel=info -Q chatting,celery
    restart: unless-stopped
    volumes:
      - ./otiva_sshop/logs:/usr/src/otiva_sshop/logs
    env_file:
      - ./otiva_sshop/.env
    environment:
      DOCKER_START_APP: true
    depends_on:
      - web
    networks:
      - default_net

  celery-make-ids:
    image: django-app-dev:1.0.0
    container_name: celery-make-ids
    entrypoint: []
    command: celery -A app.misc.celery_misc worker -n id-maker --loglevel=info  --pool=solo -Q make_emails_ids
    restart: unless-stopped
    volumes:
      - ./otiva_sshop/logs:/usr/src/otiva_sshop/logs
    env_file:
      - ./otiva_sshop/.env
    environment:
      DOCKER_START_APP: true
    depends_on:
      - web
    networks:
      - default_net


  celery-beat:
    image: django-app-dev:1.0.0
    container_name: celery-beat
    entrypoint: []
    command: celery -A app.misc.celery_misc beat --loglevel=info
    restart: unless-stopped
    volumes:
      - ./otiva_sshop/logs:/usr/src/otiva_sshop/logs
    env_file:
      - ./otiva_sshop/.env
    environment:
      DOCKER_START_APP: true
    depends_on:
      - web
    networks:
      - default_net

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --requirepass otiva_shop_redispass
    volumes:
      - redis_data:/data/
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - default_net


  flower:
    image: django-app-dev:1.0.0
    container_name: flower
    command: celery -A app.misc.celery_misc flower
    entrypoint: []
    restart: unless-stopped
    depends_on:
      - celery
    environment:
      DOCKER_START_APP: true
    ports:
      - "5555:5555"
    networks:
      - default_net

  redis-gui:
    image: redis/redisinsight
    container_name: redis-gui
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PASSWORD: otiva_shop_redispass
    ports:
      - "5540:5540"
    networks:
      - default_net


volumes:
  pg_data:
  redis_data:
  static_volume:

networks:
  default_net:
    external: true
