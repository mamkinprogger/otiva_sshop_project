{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'deps/css/style.css' %}">

    <link rel="rabbit-icon" sizes="180x180" href="{%  static "deps/favicon/android-chrome-512x512.svg" %}">
    <link rel="icon" type="image/svg" sizes="32x32" href="{%  static "deps/favicon/favicon-32x32.svg" %}">
    <link rel="icon" type="image/svg" sizes="16x16" href="{%  static "deps/favicon/favicon-16x16.svg" %}">
    <link rel="manifest" href="{%  static "deps/favicon/site.webmanifest" %}">
    <title>
        {% block title %}{% endblock %}
    </title>
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <!-- Логотип -->
            <a href="{% url 'main:index' %}" class="logo">Otiva-Shop</a>
            <!-- Навигация -->
            <nav class="nav" id="nav">
                <!-- Аккаунт -->
                <a href="#" class="nav-link active">
                    Войти
                </a>
                <!-- Информация -->
                <div class="nav-dropdown">
                    <button class="nav-link dropdown-button active">
                        Информация
                        <span class="dropdown-arrow">⌄</span>
                    </button>
                    <!-- Выпадающее меню -->
                    <div class="dropdown-menu">
                        <a href="{% url 'main:about' %}#about-main"
                            class="dropdown-link
                            {% if not request.resolver_match.url_name == 'about' %}active{% endif %}">
                            Про нас
                        </a>
                        <a href="{% url 'main:contacts' %}"
                            class="dropdown-link
                            {% if not request.resolver_match.url_name == 'contacts' %}active{% endif %}">
                            Наши контакты
                        </a>
                    </div>
                </div>
            </nav>
            <!-- Кнопка мобильного меню -->
            <button
                class="menu-button"
                id="menuButton"
                aria-label="Открыть меню"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>


    <!--Основное содержимое страницы-->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!--Footer-->
    <footer class="footer">
        <div class="container footer-inner">
            <p>© 2026 Otiva-Shop</p>
            <div class="footer-links">
                <a href="{% url 'main:index' %}">Главная</a>
                <a href="{% url 'main:about' %}#about-main">Про нас</a>
                <a href="{% url 'main:contacts' %}">Контакты</a>
            </div>
        </div>
    </footer>
    <script src="{% static 'deps/js/main.js' %}"></script>
    </body>
</html>
