services:
  web:
    container_name: django-app-load
    image: django-app-load:1.0.0
    volumes: []
    env_file:
      - .\tests\.env
    environment:
      K6_TEST_ENV: true
    networks:
      - default_net


  db:
    container_name: db-load
    environment:
      - POSTGRES_DB=otiva_shop-db-load
    volumes:
      - pg_load_data:/var/lib/postgresql/data/
    networks:
      - default_net


  celery:
    image: django-app-load:1.0.0
    container_name: celery-load
    volumes: []
    env_file:
      - .\tests\.env
    environment:
      K6_TEST_ENV: true
    networks:
      - default_net


  celery-make-ids:
    image: django-app-load:1.0.0
    container_name: celery-make-ids-load
    volumes: []
    env_file:
      - .\tests\.env
    environment:
      K6_TEST_ENV: true
    networks:
      - default_net

  celery-beat:
    image: django-app-load:1.0.0
    container_name: celery-beat-load
    volumes: []
    env_file:
      - .\tests\.env
    environment:
      K6_TEST_ENV: true
    networks:
      - default_net


  redis:
    container_name: redis-load
    command: redis-server --requirepass otiva_shop_redispass2
    volumes:
      - redis_load_data:/data/
    networks:
      - default_net

  flower:
    image: django-app-load:1.0.0
    environment:
      K6_TEST_ENV: true
    env_file:
      - .\tests\.env
    networks:
      - default_net


  redis-gui:
    environment:
      RI_REDIS_PASSWORD: otiva_shop_redispass2
    ports:
      - "5540:5540"
    networks:
      - default_net

  k6:
    build:
      context: ./tests
      dockerfile: Dockerfile-k6
    image: k6-custom:1.0.0
    container_name: k6
    command:
    - run
    - -e
    - TEST_TYPE=${TEST_TYPE}
    - /src/testing/tests/${TEST_FILE}
    ports:
      - "5665:5665"
    volumes:
      - ./tests/_reports/${REPORT_NAME}:/reports
      - ./${LOADTEST}/testing:/src/testing
    environment:
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: "0.0.0.0"
      K6_WEB_DASHBOARD_PORT: "5665"
      K6_WEB_DASHBOARD_PERIOD: "5s"
      K6_WEB_DASHBOARD_EXPORT: "${REPORT}"
    secrets:
      - db_access_token
    depends_on:
      - nginx
    networks:
      - default_net

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit
    ports:
      - "8025:8025"
    networks:
      - default_net


volumes:
  pg_load_data:
  redis_load_data:

secrets:
  db_access_token:
    file: ./secrets/db_access_token.txt

networks:
  default_net:
    external: true